<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Cubi - Focus Timer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="container">
        <header>
            <h1 class="logo">CUBI <span>WEB</span></h1>
            <p class="subtitle">Focus Flow Manager</p>
        </header>

        <section class="project-config">
            <div class="input-group">
                <input type="text" id="projectName" list="projectList" placeholder="Project Name (e.g. Learn WebGL)" autocomplete="off">
                <datalist id="projectList"></datalist>
            </div>
            <div class="input-group">
                <input type="number" id="projectEstimate" placeholder="Est. Hours (e.g. 10)" step="0.5" min="0">
            </div>
        </section>

        <section class="tag-selector">
            <button class="tag active" data-tag="WORK">WORK</button>
            <button class="tag" data-tag="READ">READ</button>
            <button class="tag" data-tag="STUDY">STUDY</button>
            <button class="tag" data-tag="REST">REST</button>
        </section>

        <section class="timer-display-container">
            <div class="timer-glass-panel" id="timerPanel">
                <div class="time-display" id="timeDisplay">25:00</div>
                <div class="status-indicator" id="statusIndicator">Ready to Focus</div>
            </div>
            <!-- The Big Button -->
            <button class="cubi-button" id="cubiBtn">
                <div class="cubi-button-inner"></div>
            </button>
            <button id="skipRestBtn" class="tag" style="display: none; margin-top: 1.5rem; border-color: var(--accent); color: var(--text-primary); transition: all 0.3s;">⏭️ Skip to Next Pomodoro</button>
        </section>

        <section class="project-progress" id="progressSection" style="display: none;">
            <div class="progress-info">
                <span id="progressProjectName">Project Name</span>
                <span id="progressPercentage">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-stats">
                <span id="progressTimeSpent">0h</span> / <span id="progressTimeEst">0h</span>
            </div>
        </section>

        <section class="controls">
            <div class="setting-group">
                <label for="focusDuration">Focus Duration</label>
                <select id="focusDuration">
                    <option value="15">15 min</option>
                    <option value="25" selected>25 min</option>
                    <option value="45">45 min</option>
                    <option value="60">60 min</option>
                    <option value="0.25">15 sec (Test)</option>
                </select>
            </div>
            <div class="setting-group">
                <label for="soundProfile">Sound</label>
                <select id="soundProfile">
                    <option value="mechanical" selected>Mechanical</option>
                    <option value="electronic">Electronic</option>
                    <option value="mute">Mute</option>
                </select>
            </div>
        </section>

        <section class="session-log">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="margin-bottom: 0;">Session Logs</h2>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <button id="projectStatsBtn" class="tag" title="View Project Statistics">📊 Stats</button>
                    <button id="exportDataBtn" class="tag" title="Export all data as JSON">📥 Export</button>
                    <select id="logFilter" class="tag" style="padding: 0.3rem 0.8rem; outline: none; appearance: auto; -webkit-appearance: auto;">
                        <option value="today">Today</option>
                        <option value="all">All Time</option>
                    </select>
                </div>
            </div>
            <ul class="log-list" id="logList">
                <!-- Logs will be populated here -->
            </ul>
        </section>
    </main>

    <div class="version-tag">v1.4.0</div>

    <!-- Edit Log Modal -->
    <div id="editLogModal" class="modal-overlay" style="display: none;">
        <div class="modal-content timer-glass-panel" style="padding: 2rem; max-width: 320px; text-align: left;">
            <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;">Edit Record</h3>
            <div class="input-group" style="margin-bottom: 1rem;">
                <input type="text" id="editLogProject" placeholder="Project Name">
            </div>
            <div class="input-group" style="margin-bottom: 1rem; background: var(--glass-bg); padding: 0.5rem 1rem; border-radius: 12px; border: 1px solid var(--glass-border);">
                <select id="editLogTag" style="width: 100%;">
                    <option value="WORK">WORK</option>
                    <option value="READ">READ</option>
                    <option value="STUDY">STUDY</option>
                    <option value="REST">REST</option>
                </select>
            </div>
            <div class="input-group" style="margin-bottom: 1.5rem;">
                <label style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem; display: block; margin-left: 0.5rem;">Duration (seconds)</label>
                <input type="number" id="editLogDuration" step="1" min="1" style="width: 100%;">
            </div>
            <div class="modal-actions" style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button id="cancelEditBtn" class="tag">Cancel</button>
                <button id="saveEditBtn" class="tag active">Save</button>
            </div>
        </div>
    </div>

    <!-- Project Stats Modal -->
    <div id="projectStatsModal" class="modal-overlay" style="display: none;">
        <div class="modal-content timer-glass-panel" style="padding: 2rem; max-width: 400px; width: 90%; text-align: left; max-height: 80vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.2rem; margin: 0;">Project Statistics</h3>
                <button id="closeStatsBtn" class="edit-log-btn" style="font-size: 1.2rem; opacity: 0.8;">✖</button>
            </div>
            <div id="projectStatsContent" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Stats will be populated here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
